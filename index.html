<!DOCTYPE html>
<html lang="en"> 
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Oldbury Yard Trail</title>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f3e8;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

header{
  background:#f8f6ef;
  color:white;
  text-align:center;
  padding:20px;
}

#counter{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  padding:20px;
}

#map{
  height:75vh;
}
.balloon{
    position:fixed;
    font-size:42px;
    opacity:.65;
    pointer-events:none;
    z-index:999;
    animation:floatUp 22s linear infinite;
}

.balloon1{
    left:5%;
    bottom:-80px;
    animation-delay:0s;
}

.balloon2{
    right:8%;
    bottom:-120px;
    animation-delay:10s;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(-4deg);
        opacity:0;
    }

    10%{
        opacity:.7;
    }

    90%{
        opacity:.7;
    }

    100%{
        transform:translateY(-120vh) rotate(8deg);
        opacity:0;
    }
}.leaf{
    position:fixed;
    font-size:32px;
    opacity:.25;
    pointer-events:none;
    z-index:998;
    animation:drift 18s linear infinite;
}

.leaf1{
    top:40px;
    left:15px;
}

.leaf2{
    top:60px;
    right:20px;
    animation-delay:6s;
}

@keyframes drift{
    0%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(20px) rotate(10deg);
    }
    100%{
        transform:translateY(0) rotate(-10deg);
    }
}
  .action-button{
    display:inline-block;
    padding:16px 28px;
    margin:8px;
    border-radius:18px;
    color:white;
    text-decoration:none;
    font-family:'Bree Serif', serif;
    font-size:22px;
    background:linear-gradient(#46a84d,#2e7d32);
    border:3px solid rgba(255,255,255,.35);
    box-shadow:0 6px 12px rgba(0,0,0,.25);
    transition:.2s;
}

.action-button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 16px rgba(0,0,0,.35);}
}

</style>
</head>

<body>

  <div class="balloon balloon1">🎈</div>
<div class="balloon balloon2">🎈</div>

  <div class="leaf leaf1">🍃</div>
<div class="leaf leaf2">🌿</div>

<header style="padding:0;background:white;">
  <img src="banner.png" alt="Great Oldbury Yard Trail"
       style="width:100%;display:block;">
</header>
<div id="counter">Loading stalls...</div>
  <div style="text-align:center;padding:20px;">

<a class="action-button" href="https://forms.gle/khJBFPstm2AMnSms5"
target="_blank"

🏡 Register Your Driveway Sale
</a>

<a class="action-button" href="map.html">
🗺️ View Interactive Map
</a>

<a class="action-button" href="https://www.facebook.com/share/1J8zw8SwZT/"
target="_blank"

📘 Facebook Event
</a>

  </div>
<script>
fetch("stalls.json?v=" + Date.now())
  .then(response => response.json())
  .then(stalls => {
    document.getElementById("counter").innerHTML =
      "🏡 " + stalls.length + " Stalls Confirmed";
  })
  .catch(() => {
    document.getElementById("counter").innerHTML =
      "Unable to load stalls.";
  });
</script>

  <div style="text-align:center;padding:20px;">

<img src="homepage-infographic-v2.png.png"
     alt="Great Oldbury Yard Trail Information"
     style="width:112%;max-width:none;margin-left:-6%;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.15);"

  </div> 
</body>
</html>
