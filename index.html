<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Oldbury Yard Trail</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f3e8;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

header{
  background:#f8f6ef;
  color:white;
  text-align:center;
  padding:20px;
}

#counter{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  padding:20px;
}

#map{
  height:75vh;
}
.balloon{
    position:fixed;
    font-size:42px;
    opacity:.65;
    pointer-events:none;
    z-index:999;
    animation:floatUp 22s linear infinite;
}

.balloon1{
    left:5%;
    bottom:-80px;
    animation-delay:0s;
}

.balloon2{
    right:8%;
    bottom:-120px;
    animation-delay:10s;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(-4deg);
        opacity:0;
    }

    10%{
        opacity:.7;
    }

    90%{
        opacity:.7;
    }

    100%{
        transform:translateY(-120vh) rotate(8deg);
        opacity:0;
    }
}
</style>
</head>

<body>

  <div class="balloon balloon1">🎈</div>
<div class="balloon balloon2">🎈</div>
  

<header style="padding:0;background:white;">
  <img src="banner.png" alt="Great Oldbury Yard Trail"
       style="width:100%;display:block;">
</header>
<div id="counter">Loading stalls...</div>
  <div style="text-align:center;padding:20px;">

<a href="https://forms.gle/khJBFPstm2AMnSms5"
target="_blank"
style="display:inline-block;
background:#2e7d32;
color:white;
padding:14px 24px;
margin:8px;
text-decoration:none;
border-radius:8px;
font-size:18px;
font-weight:bold;">
🏡 Register Your Driveway Sale
</a>

<a href="map.html"
style="display:inline-block;
background:#1976d2;
color:white;
padding:14px 24px;
margin:8px;
text-decoration:none;
border-radius:8px;
font-size:18px;
font-weight:bold;">
🗺️ View Interactive Map
</a>

<a href="https://www.facebook.com/share/1J8zw8SwZT/"
target="_blank"
style="display:inline-block;
background:#4267B2;
color:white;
padding:14px 24px;
margin:8px;
text-decoration:none;
border-radius:8px;
font-size:18px;
font-weight:bold;">
📘 Facebook Event
</a>

  </div>
<script>
fetch("stalls.json?v=" + Date.now())
  .then(response => response.json())
  .then(stalls => {
    document.getElementById("counter").innerHTML =
      "🏡 " + stalls.length + " Stalls Confirmed";
  })
  .catch(() => {
    document.getElementById("counter").innerHTML =
      "Unable to load stalls.";
  });
</script>

  <div style="text-align:center;padding:20px;">

<img src="Great-Oldbury-Yard-Trail-Homepage.png"
     alt="Great Oldbury Yard Trail Information"
     style="width:112%;max-width:none;margin-left:-6%;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.15);"

  </div> 
</body>
